[package]
name = "lucent"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rquickjs = "0.14"
wgpu = "22.1"
tiny-skia = "0.11"
cosmic-text = "0.14"
futures-lite = "2.6"
bytemuck = "1"
winit = "0.30"
softbuffer = "0.4"
rodio = "0.21"
resvg = { version = "0.47", default-features = false, features = ["text"] }
rustybuzz = "0.20"
